<template>
    <div class="slds-p-around_medium">
        <h1 class="slds-text-heading_large slds-m-bottom_medium">Account 360 - LWC</h1>

        <template if:true={hasError}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                {errorMessage}
            </div>
        </template>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <div class="slds-grid slds-gutters slds-m-bottom_medium">
            <div class="slds-col slds-size_8-of-12">
                <lightning-input
                    label="Search Accounts by Name"
                    value={searchTerm}
                    placeholder="e.g. Acme"
                    onchange={handleSearchTermChange}
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_4-of-12 slds-align-bottom">
                <lightning-button label="Search" variant="brand" onclick={handleSearch}></lightning-button>
            </div>
        </div>

        <template if:true={hasAccountOptions}>
            <lightning-combobox
                label="Select an Account"
                value={selectedAccountId}
                options={accountComboboxOptions}
                placeholder="-- Search results --"
                onchange={handleAccountSelect}
                class="slds-m-bottom_medium"
            ></lightning-combobox>
        </template>
        <template if:true={showNoAccountResults}>
            <p class="slds-text-color_weak slds-m-bottom_medium">No matching Accounts.</p>
        </template>

        <template if:true={hasDashboard}>
            <div class="slds-box slds-m-bottom_medium">
                <h2 class="slds-text-heading_medium">{dashboard.account.name}</h2>
                <p>Industry: {dashboard.account.industry}</p>
                <p>Phone: {dashboard.account.phone}</p>
                <p>Owner: {dashboard.account.ownerName}</p>
                <p>Billing City/State: {dashboard.account.billingCity}, {dashboard.account.billingState}</p>
            </div>

            <div class="slds-box slds-m-bottom_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">Contacts</h3>
                <template if:false={hasContacts}>
                    <p class="slds-text-color_weak">No Contacts for this Account.</p>
                </template>
                <template if:true={hasContacts}>
                    <table class="slds-table slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Name</th>
                                <th scope="col">Title</th>
                                <th scope="col">Email</th>
                                <th scope="col">Phone</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={dashboard.contacts} for:item="c">
                                <tr key={c.id}>
                                    <td>{c.name}</td>
                                    <td>{c.title}</td>
                                    <td>{c.email}</td>
                                    <td>{c.phone}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
            </div>

            <div class="slds-box slds-m-bottom_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">Opportunities</h3>
                <lightning-combobox
                    label="Filter by Stage"
                    value={stageFilter}
                    options={stageFilterOptions}
                    onchange={handleStageFilterChange}
                    class="slds-m-bottom_small"
                ></lightning-combobox>

                <template if:false={hasOpportunities}>
                    <p class="slds-text-color_weak">No Opportunities match the current filter.</p>
                </template>
                <template if:true={hasOpportunities}>
                    <table class="slds-table slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Name</th>
                                <th scope="col">Stage</th>
                                <th scope="col">Amount</th>
                                <th scope="col">Close Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredOpportunities} for:item="o">
                                <tr key={o.id}>
                                    <td>{o.name}</td>
                                    <td>{o.stageName}</td>
                                    <td>{o.amount}</td>
                                    <td>{o.closeDate}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <p class="slds-text-heading_small slds-m-top_small slds-m-bottom_medium">
                    Total Pipeline (filtered): {pipelineTotal}
                </p>

                <div class="slds-box slds-theme_shade">
                    <h4 class="slds-text-heading_small slds-m-bottom_small">Update an Opportunity's Stage</h4>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_4-of-12">
                            <lightning-combobox
                                label="Opportunity"
                                value={editingOpportunityId}
                                options={opportunityPickerOptions}
                                placeholder="-- Select an Opportunity --"
                                onchange={handleEditingOppChange}
                            ></lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_4-of-12">
                            <lightning-combobox
                                label="New Stage"
                                value={newStageValue}
                                options={stagePickerOptions}
                                placeholder="-- Select a Stage --"
                                onchange={handleNewStageChange}
                            ></lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_4-of-12 slds-align-bottom">
                            <lightning-button label="Update Stage" variant="brand" onclick={handleUpdateStage}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
